<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>

   *{
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif; 
    box-sizing: border-box;
   }

   .container{
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    padding: 10px;
   }

   .todo-app{
    width: 100%;
    max-width: 540px;
    background: #fff;
    margin: 100px auto 20px;
    padding: 40px 30px 70px;
    border-radius: 10px;
   }

   .todo-app h2{
     color: #002765;
     display: flex;
     align-items: center;
     margin-bottom: 20px;

   }

   .todo-app h2 img{
    width:30px ;
    margin-left: 10px;
   }

   .row{
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #edeef0;
    border-radius: 30px;
    padding-left: 20px;
    margin-bottom: 25px;

   }

   input{
    flex:1;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px;
   }

   button{
    border: none;
    outline: none;
    padding: 16px 50px;
    background: #ff5945;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    border-radius: 40px;
   }

   ul li {
    list-style: none;
    font-size: 17px;
    padding: 12px 8px 12px 50px ;
    user-select: none;
    cursor: pointer;
    position: relative;
   }

   ul li::before{
    content: '';
    position: absolute;
    height: 28px;
    width: 28px;
    border-radius: 50%;
    background-image: url(unchecked-41.png);
    background-size: cover;
    top: 12px;
    left: 8px;
   }

   .checked{
    
   }

   

    </style>

</head>
<body>

<div class="container">
    <div class="todo-app">
        <h2> To-Do List <img src="https://cdn.pixabay.com/photo/2016/03/31/19/50/checklist-1295319_1280.png" ></h2>
        <div class="row">
            <input type="text" id="input-box" placeholder="Enter Your Task">
            <button>Add</button>
        </div>
        <ul id="list-container">
            <li class="checked">Task 1</li>
            <li>Task 2</li>
            <li>Task 3</li>
        </ul>
    </div>
</div>

    <script src="To-do.js"></script>
</body>
</html>
