<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

     <link rel="stylesheet" href="/TailwindCss/src/output.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            font-family: Arial,sans-serif;
            box-sizing: border-box;
        }

        body{
             background: url('https://th.bing.com/th/id/R.a5eccd750f64c42ac76171a6eb828f69?rik=CvABoQ7%2baowyEA&riu=http%3a%2f%2fwww.pixelstalk.net%2fwp-content%2fuploads%2f2016%2f07%2fAmazing-sunset-colors-wallpaper-4k.jpg&ehk=8lLXROyIBgEFeelIpEJeN%2f3dHR7fJg26VN4nnivqMjE%3d&risl=&pid=ImgRaw&r=0') no-repeat center fixed ;
        }

        .card{
            width: 90%;
            max-width: 470px;
            color: #fff;
            margin: 100px auto 0;
            border-radius: 20px;
            padding: 40px 35px;
            text-align: center;
            /* box-shadow: 0 0 8px white , 0 0 8px white; */
            box-shadow: 0 4px 30px rgba(253, 253, 253, 0.2);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 

        }

        .search{
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            
        }

        .search input{
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 30px;
            height: 60px;
            flex: 1;
            margin-right: 16px;
            font-size: 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
        }

        .search input:hover{
             box-shadow: 0 0 10px rgb(255, 255, 255);
        }

        .search button {
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            backdrop-filter: blur(10px); /* Glass blur */
            -webkit-backdrop-filter: blur(10px); 
        }

        .search button:hover{
             box-shadow: 0 0 10px rgb(255, 255, 255), 0 0 10px rgb(255, 255, 255);
        }

       .search button i{
            font-size: 25px;
            color: black;
       }

       .weather-icon {
            width: 170px;
            margin-top: 30px;
            margin-left: 30%;
       }

       .weather h1 {
            font-size: 80px;
            font-weight: 500;
        
       }

       .weather h2 {
            font-size: 45px;
            font-weight: 400;
            margin-top: -10px;
       }

       .details{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            margin-top: 50px ;
            gap: 70px;
       }

       .col{
            display: flex;
            align-items: center;
            text-align: left;
        
       }

       .col img{
            width: 40px;
            margin-right: 10px;
       }

       .humidity, .wind{
            font-size: 25px;
            margin-top: -6px;
       }

       .error{
        text-align: left;
        margin-left: 10px;
        margin-top: 10px;
        font-size: 14px;
        display: none ;
        
       }

       .weather{
        display: none ;
       }



    </style>
</head>
<body>
<div class="card">

    <div class="search">
        <input type="text" placeholder="Enter city name" spellcheck="false">
        <button> <i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="error text-black font-bold">
        <p>Invalid city name</p>
    </div>

    <div class="weather">
        <img src="https://cdn3.iconfinder.com/data/icons/sunnyday-2/142/medium_cloudy_heavy_rain-1024.png" 
        class="weather-icon">

        <h1 class="temp text-black" >22°c</h1>
        <h2 class="city text-black ">New York</h2>

        <div class="details">
            <div class="col">
                <img src="https://cdn0.iconfinder.com/data/icons/weather-forecast-18/40/Precipitation_Humidity_Waves_Water_Weather_Forecast-512.png" >
                <div>
                    <p class="humidity text-black font-bold">50%</p>
                    <p class="text-black font-bold">Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/3104/3104631.png" >
                <div>
                    <p class="wind text-black font-bold">15 km/h</p>
                    <p class="text-black font-bold">Wind speed</p>
                </div>
            </div>
        </div>
    </div>
</div>



<script src="WeatherApp.js"></script>


</body>
</html>
