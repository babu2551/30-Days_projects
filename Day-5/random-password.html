<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family:Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        body{
            background-color: #454646;
            color: #fff;
        }
        .conatiner{
            margin: 12%;
            width: 90%;
            max-width: 700px;
        }
        .display{
            width: 100%;
            margin-top: 50px;
            margin-bottom: 30px;
            background: #fff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 20px;
            border-radius: 5px;
        }
        .conatiner h1 {
            font-weight: 500;
            font-size: 45px;
        }
        .conatiner h1 span {
            color: #f4c015;
            border-bottom: 4px solid #dca00a;
            padding-bottom: 7px ;
        }
        .display img {
            width: 30px;
            cursor: pointer;
        }
        .display input {
            border: 0;
            outline: 0;
            font-size: 24px;
        }
        .conatiner button img{
            width: 28px;
            margin-right: 10px;
        }
        .conatiner button{
            border: 0;
            outline: 0;
            background:#9f9701 ;
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 26px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="conatiner">
        <h1>Generate a <br> <span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="Password" placeholder="Password">
            <img src="https://cdn-icons-png.flaticon.com/512/4837/4837299.png" alt="images" onclick="copyPassword()">
        </div>
        <button onclick="createPassword()"><img src="https://cdn-icons-png.flaticon.com/512/5346/5346469.png">Generate Password</button>
    </div>

    <script src="random-password.js"></script>
</body>
</html>
