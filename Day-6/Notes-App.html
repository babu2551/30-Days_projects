<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg,#cf9aff,#95c0ff );
            color: #fff;
            padding-top: 4%;
            padding-left: 10% ;
        }
        .container h1{
            display: flex;
            align-items: center;
            font-size: 35px;
            font-weight: 600;
        }
        .container h1 img{
            width: 60px;
        }
        .container button img{
            width: 30px;
            margin-right: 8px;
        }
        .container button{
            display: flex;
            align-items: center;
            background: linear-gradient(#9418fd, #571094);
            color: #fff;
            font-size: 16px;
            outline: 0;
            border: 0;
            border-radius: 40px;
            padding: 15px 25px ;
            margin: 30px 0 20px;
            cursor: pointer;
        }
        .input-box{
            position: relative;
            width: 100%;
            max-width: 500px;
            min-height: 150px;
            background: #fff;
            color: #333;
            padding: 20px;
            margin: 20px 0;
            outline: none;
            border-radius: 5px;
        }
        .input-box img{
            width: 25px;
            position: absolute;
            bottom: 15px;
            right: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><img src="https://cdn-icons-png.flaticon.com/512/3982/3982361.png">Notes</h1>
        <button class="btn"><img src="https://cdn-icons-png.flaticon.com/512/4226/4226577.png" >Create Notes</button>
        <div class="notes-container">   
            <!-- <p contenteditable="true" class="input-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFUqyIyvfNYC8c566c1sjGOtKiBCRwgeo01Q&s">
            </p> -->
        </div>
    </div>
    
    <script src="Notes-App.js"></script>
</body>
</html>
